[project]
name = "nagi"
version = "0.1.0"
description = "Nagi is Not Artificial General Intelligence."
readme = "README.md"
authors = [
    { name = "Ju Lin", email = "soasme@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
nagi = "nagi:main"

[project.entry-points."nagi.modules"]
greeting = "nagi.modules.greeting"
speech = "nagi.modules.speech"

[project.entry-points."nagi.learning"]
learn = "nagi.modules.learn"

[project.entry-points."nagi.curricula"]
nagi = "nagi.assets"

[build-system]
requires = ["uv_build>=0.10.6,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "nagi-birthdays",
    "nagi-todo",
]

[tool.uv.workspace]
members = ["examples/*"]

[tool.uv.sources]
nagi-birthdays = { workspace = true }
nagi-todo = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests", "examples"]
